<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kanban</title>
    <!-- The adaptive panel shell: no padding of its own (both views carry
         theirs — .kb-rail and .kb-page), the frame scrolls like the
         full-screen page does, so the board behaves in the panel exactly as
         it does full-screen. -->
    <style>html, body { margin: 0; height: 100%; } #root { height: 100%; overflow-y: auto; }</style>
  </head>
  <body>
    <div id="root"></div>
    <script src="frame.js"></script>
  </body>
</html>
